[package]
name = "rucelium-gateway"
version.workspace = true
edition.workspace = true
description = "RuCelium rhizome gateway daemon: UDP envelope ingestion (v1/v2/fragments), calibration, durable store, WorldGraph, local alerts, OGC SensorThings HTTP API, and biome federation sync over the network (ADR-265 §4)"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["environmental", "gateway", "daemon", "sensorthings"]
categories = ["science", "web-programming"]

[[bin]]
name = "rucelium-gateway"
path = "src/main.rs"

[dependencies]
rucelium-core = { workspace = true }
rucelium-abi = { workspace = true }
rucelium-transport = { workspace = true }
rucelium-ingest = { workspace = true }
rucelium-calibration = { workspace = true }
rucelium-worldgraph = { workspace = true }
rucelium-federation = { workspace = true }
rucelium-policy = { workspace = true }
rucelium-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
